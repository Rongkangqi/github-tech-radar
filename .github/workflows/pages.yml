name: Sync GitHub radar and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-radar-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out latest source
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Collect public GitHub repository data
        run: npm run sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Preserve snapshots for the next comparison
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/data
          if ! git diff --cached --quiet; then
            git commit -m 'Update public GitHub radar snapshots'
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5
